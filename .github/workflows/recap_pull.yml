name: One-off league data pull (recap branch only)
on:
  push:
    branches: [recap-data]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/pull_league.py
      - run: |
          git config user.name "diamond-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f recap_out/
          git commit -m "League data pull" && git push origin HEAD:recap-data
