<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Scout — Start/Sit</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@300;400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080d;--s1:#0b0f17;--s2:#111722;--s3:#181f2e;
  --b1:#1c2535;--b2:#27364f;
  --gold:#f0b429;--gdim:rgba(240,180,41,.1);
  --green:#3dd68c;--red:#f16b6b;--blue:#58a6e8;--purple:#b48eff;--teal:#2dd4bf;--orange:#fb923c;
  --text:#d4dce8;--t2:#8494ae;--t3:#5a6a82;
  --pos-qb:#f43f5e;--pos-rb:#3dd68c;--pos-wr:#58a6e8;--pos-te:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;min-height:100vh}
.hdr{height:52px;display:flex;align-items:stretch;border-bottom:1px solid var(--b1);background:rgba(5,8,13,.97);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
.hbrand{display:flex;align-items:center;gap:11px;padding:0 20px;border-right:1px solid var(--b1)}
.logo{width:30px;height:30px;border-radius:50%;background:conic-gradient(#f43f5e 0deg 72deg,#3dd68c 72deg 144deg,#58a6e8 144deg 216deg,#fb923c 216deg 288deg,#b48eff 288deg);box-shadow:0 0 14px rgba(240,180,41,.25)}
.btext .t1{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;line-height:1}
.btext .t2s{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--t3);letter-spacing:2.5px}
.hright{padding:0 20px;display:flex;align-items:center;gap:8px;margin-left:auto}
.badge{font-family:'IBM Plex Mono',monospace;font-size:.55rem;padding:3px 8px;border-radius:2px;letter-spacing:1.5px;color:var(--gold);background:var(--gdim);border:1px solid rgba(240,180,41,.22)}
.app{max-width:1080px;margin:0 auto;padding:28px 20px}

/* SCORING */
.top-row{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.sc-lbl{font-family:'IBM Plex Mono',monospace;font-size:.56rem;color:var(--t3);letter-spacing:2px;text-transform:uppercase}
.sc-pill{font-family:'IBM Plex Mono',monospace;font-size:.58rem;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--b2);background:transparent;color:var(--t3);transition:all .15s}
.sc-pill.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.wk-info{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--t3)}
.wk-info strong{color:var(--gold)}
.wk-info .stale{color:var(--red)}

/* PLAYER PANELS */
.compare{display:grid;grid-template-columns:1fr 52px 1fr;gap:14px;align-items:start;margin-bottom:24px}
.pcard{background:var(--s1);border:1px solid var(--b1);border-radius:4px}
.pcard.ready{border-color:rgba(61,214,140,.3)}
.pcard.warn{border-color:rgba(241,107,107,.4)}
.name-row{display:flex;align-items:center;border-bottom:1px solid var(--b1);position:relative}
.name-inp{flex:1;min-width:0;background:transparent;border:none;padding:13px 14px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.5px;outline:none}
.name-inp::placeholder{color:var(--t3);font-weight:400}
.player-status{font-family:'IBM Plex Mono',monospace;font-size:.52rem;padding:2px 7px;border-radius:2px;margin-right:10px;flex-shrink:0}
.status-active{background:rgba(61,214,140,.1);color:var(--green);border:1px solid rgba(61,214,140,.2)}
.status-q{background:rgba(240,180,41,.1);color:var(--gold);border:1px solid rgba(240,180,41,.2)}
.status-out{background:rgba(241,107,107,.1);color:var(--red);border:1px solid rgba(241,107,107,.2)}
.search-drop{position:absolute;top:100%;left:0;right:0;background:var(--s2);border:1px solid var(--b2);border-top:none;border-radius:0 0 3px 3px;z-index:50;max-height:260px;overflow-y:auto}
.search-item{padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(28,37,53,.5);transition:background .1s}
.search-item:hover,.search-item.sel{background:rgba(27,38,60,.9)}
.search-item:last-child{border-bottom:none}
.si-name{font-size:.78rem;font-weight:600;color:var(--text);flex:1}
.si-meta{font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:var(--t3)}
.si-inj{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--gold)}
.si-inj.out{color:var(--red)}
.ppos-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.54rem;font-weight:600;padding:2px 7px;border-radius:3px}
.pos-QB{background:rgba(244,63,94,.12);color:var(--pos-qb);border:1px solid rgba(244,63,94,.25)}
.pos-RB{background:rgba(61,214,140,.1);color:var(--pos-rb);border:1px solid rgba(61,214,140,.2)}
.pos-WR{background:rgba(88,166,232,.1);color:var(--pos-wr);border:1px solid rgba(88,166,232,.2)}
.pos-TE{background:rgba(251,146,60,.12);color:var(--pos-te);border:1px solid rgba(251,146,60,.25)}

/* STAT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.sc{padding:9px 13px;border-bottom:1px solid var(--b1);border-right:1px solid var(--b1);display:flex;flex-direction:column;gap:2px}
.sc:nth-child(even){border-right:none}
.sc:nth-last-child(-n+2){border-bottom:none}
.slbl{font-family:'IBM Plex Mono',monospace;font-size:.49rem;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase}
.sval{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:500;color:var(--text)}
.sval-inp{background:transparent;border:none;outline:none;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:500;width:100%;padding:0}
.sval-inp::placeholder{color:var(--t3)}
.sval-inp.auto{color:var(--teal)}
.info-row{padding:8px 13px;border-top:1px solid var(--b1);background:var(--s3);font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:var(--t3);min-height:30px;line-height:1.5}
.info-row .bad{color:var(--red)}
.info-row .meh{color:var(--gold)}

/* VS */
.vs-dot{display:flex;align-items:center;justify-content:center;width:52px;height:52px;background:var(--s2);border:1px solid var(--b1);border-radius:50%;font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:800;letter-spacing:2px;color:var(--t3);align-self:center}

/* ANALYZE */
.analyze-row{text-align:center;margin-bottom:28px}
.abtn{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;background:var(--gold);color:#06090f;border:none;border-radius:3px;padding:12px 44px;cursor:pointer;transition:all .2s}
.abtn:hover{background:#fdc138;box-shadow:0 4px 20px rgba(240,180,41,.3)}
.hint{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--t3);margin-top:8px;min-height:1em}

/* RESULTS */
.results{display:none}
.results.show{display:block}
.verdict{background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:20px 24px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.vname{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900;line-height:1}
.vtag{font-family:'IBM Plex Mono',monospace;font-size:.56rem;padding:2px 9px;border-radius:2px;letter-spacing:2px;display:inline-block;margin-top:5px}
.vtag-start{background:rgba(61,214,140,.12);color:var(--green);border:1px solid rgba(61,214,140,.25)}
.vtag-toss{background:rgba(88,166,232,.1);color:var(--blue);border:1px solid rgba(88,166,232,.2)}
.edge-bar{height:4px;background:var(--b2);border-radius:2px;overflow:hidden;margin:10px 0 4px;width:240px;max-width:100%}
.edge-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .6s cubic-bezier(.4,0,.2,1)}
.edge-lbl{font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:var(--t3)}
.vpts{font-family:'Barlow Condensed',sans-serif;font-size:2.6rem;font-weight:900;color:var(--gold);line-height:1;text-align:right}
.vpts-lbl{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--t3);text-align:right;letter-spacing:1.5px}
.vpts2{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--t3);text-align:right;margin-top:2px}
.factors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.fcard{background:var(--s2);border:1px solid var(--b1);border-radius:3px;padding:11px 13px}
.flbl{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.fwinner{font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:1px}
.fdetail{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--t2);line-height:1.5}
.fedge{font-family:'IBM Plex Mono',monospace;font-size:.52rem;padding:2px 6px;border-radius:2px;display:inline-block;margin-top:5px}
.fe-big{background:rgba(61,214,140,.1);color:var(--green);border:1px solid rgba(61,214,140,.2)}
.fe-sm{background:rgba(88,166,232,.1);color:var(--blue);border:1px solid rgba(88,166,232,.2)}
.fe-eq{background:rgba(100,116,139,.1);color:var(--t2);border:1px solid rgba(100,116,139,.2)}
.abox{background:var(--s1);border:1px solid var(--b1);border-radius:4px;padding:18px 20px;margin-bottom:16px}
.ahdr{font-family:'IBM Plex Mono',monospace;font-size:.52rem;letter-spacing:2.5px;color:var(--t3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ahdr::after{content:'';flex:1;height:1px;background:var(--b1)}
.atext{font-size:.85rem;line-height:1.85;color:var(--t2)}
.atext strong{color:var(--text)}
.ctable{background:var(--s1);border:1px solid var(--b1);border-radius:4px;overflow:hidden}
.crow{display:grid;grid-template-columns:1fr 130px 1fr;border-bottom:1px solid rgba(28,37,53,.5)}
.crow:last-child{border-bottom:none}
.crow.chdr{background:var(--s2)}
.cc{padding:8px 13px;font-family:'IBM Plex Mono',monospace;font-size:.64rem;color:var(--t2)}
.cc.cp1{text-align:right}.cc.cp2{text-align:left}
.cc.clbl{text-align:center;color:var(--t3);font-size:.52rem;letter-spacing:.5px;display:flex;align-items:center;justify-content:center}
.cc.cwin{color:var(--green);font-weight:600}
.cc.chdr-name{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:700;color:var(--text)}

@media (max-width:720px){
  .hbrand{padding:0 12px}.hright{padding:0 12px}
  .app{padding:18px 12px}
  .compare{grid-template-columns:1fr}
  .vs-dot{justify-self:center;width:40px;height:40px;font-size:.75rem}
  .wk-info{margin-left:0;width:100%}
  .factors{grid-template-columns:1fr 1fr}
  .verdict{grid-template-columns:1fr}
  .vpts,.vpts-lbl,.vpts2{text-align:left}
  .crow{grid-template-columns:1fr 96px 1fr}
}
</style>
</head>
<body>
<div class="hdr">
  <div class="hbrand">
    <div class="logo"></div>
    <div class="btext"><div class="t1">Diamond Scout</div><div class="t2s" id="season-lbl">Start / Sit</div></div>
  </div>
  <div class="hright">
    <span class="badge" id="wk-badge">WEEK —</span>
    <span class="badge" id="sc-badge" style="color:var(--blue);background:rgba(88,166,232,.08);border-color:rgba(88,166,232,.2)">PPR</span>
  </div>
</div>

<div class="app">
  <div class="top-row">
    <span class="sc-lbl">Scoring</span>
    <button class="sc-pill on" data-sc="ppr">PPR</button>

    <span class="wk-info" id="wk-info"></span>

  <div class="compare" id="compare"></div>

  <div class="results" id="results">
    <div class="verdict">
      <div>
        <div class="vname" id="vname">—</div>
        <div><span class="vtag" id="vtag">START</span><span style="font-family:'IBM Plex Mono',monospace;font-size:.56rem;color:var(--t3);margin-left:8px" id="vsub"></span></div>
        <div class="edge-bar"><div class="edge-fill" id="efill" style="width:50%"></div></div>
        <div class="edge-lbl" id="elbl"></div>
      </div>
      <div>
        <div class="vpts" id="vpts">—</div>
        <div class="vpts-lbl">projected pts</div>
        <div class="vpts2" id="vpts2"></div>
      </div>
    </div>
    <div class="factors" id="factors"></div>
    <div class="abox"><div class="ahdr">Analysis</div><div class="atext" id="atext"></div></div>
    <div class="ctable" id="ctable"></div>
  </div>
</div>

const POS=['QB','RB','WR','TE'];
const OUT_STATUSES=['Out','IR','PUP','Sus','NA','DNR','COV'];
const W=META.window||'L3';
let scoring='ppr';
const sel=[null,null];          // selected PLAYERS entries
const results=[[],[]];          // current dropdown results
const hi=[0,0];                 // highlighted dropdown row

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[.'’`-]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
PLAYERS.forEach(p=>{p._k=norm(p.n);});

// ── HEADER ──────────────────────────────────────────────────────────────────
function renderHeader(){
  $('wk-badge').textContent=META.week?`WEEK ${META.week}`:'WEEK —';
  $('season-lbl').textContent=`Start / Sit · ${META.season||''}`;
  let txt=`Week <strong>${META.week||'—'}</strong>`;
  if(META.updated){
    const d=new Date(META.updated);
    const hrs=(Date.now()-d)/36e5;
    const when=d.toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    txt+=` · updated ${when}`;
    if(hrs>48) txt+=` · <span class="stale">data is ${Math.floor(hrs/24)} days old</span>`;
  }
  if(BYES.length) txt+=` · BYE: ${BYES.join(', ')}`;
  $('wk-info').innerHTML=txt;
}

// ── PLAYER CARDS ────────────────────────────────────────────────────────────
function cardHTML(n){
  const f=(lbl,id,ph,step='0.1',lblId='')=>`<div class="sc"><span class="slbl"${lblId?` id="${lblId}"`:''}>${lbl}</span><input class="sval-inp" id="${id}${n}" type="number" step="${step}" placeholder="${ph}" inputmode="decimal"></div>`;
  return `<div class="pcard" id="c${n}">
    <div class="name-row">
      <input class="name-inp" id="n${n}" placeholder="Player ${n}, start typing…" autocomplete="off" spellcheck="false">
      <span class="player-status" id="st${n}" style="display:none"></span>
      <div class="search-drop" id="sd${n}" style="display:none"></div>
    </div>
    <div class="sgrid">
      <div class="sc"><span class="slbl">Position</span><span class="sval" id="pos${n}">—</span></div>
      <div class="sc"><span class="slbl">Team · Opp</span><span class="sval" id="tm${n}">—</span></div>
      ${f('Implied pts','impl','e.g. 26.5','0.5')}
      ${f('Game O/U','tot','e.g. 48.5','0.5')}
      ${f('Spread','spd','neg = fav','0.5')}
      ${f('Def rank vs pos','def','1=easy 32=hard','1')}
      ${f(`Volume/G ${W}`,'vol','—','0.1',`vl${n}`)}
      ${f(`Snap % ${W}`,'snp','—','1')}
      ${f(`RZ opps/G ${W}`,'rz','—','0.1')}
      ${f(`Pts/G ${W}`,'frm','—','0.1')}
    </div>
    <div class="info-row" id="info${n}">Search any QB, RB, WR, or TE. Stats fill in automatically.</div>
  </div>`;
}
$('compare').innerHTML=cardHTML(1)+'<div class="vs-dot">VS</div>'+cardHTML(2);

[1,2].forEach(n=>{
  $(`n${n}`).addEventListener('input',e=>onSearch(n,e.target.value));
  $(`n${n}`).addEventListener('keydown',e=>onKey(n,e));
  $(`n${n}`).addEventListener('focus',e=>{if(e.target.value.length>=2)onSearch(n,e.target.value);});
  // typing in a stat box marks it as a manual override so auto-fill won't clobber it
  ['impl','tot','spd','def','vol','snp','rz','frm'].forEach(k=>{
    $(k+n).addEventListener('input',e=>{e.target.dataset.manual='1';e.target.classList.remove('auto');});
  });
});
document.addEventListener('click',e=>{
  [1,2].forEach(n=>{if(!e.target.closest(`#c${n} .name-row`))$(`sd${n}`).style.display='none';});
});

// ── SEARCH (local, instant) ─────────────────────────────────────────────────
function search(q){
  const k=norm(q); if(k.length<2) return [];
  const up=q.trim().toUpperCase();
  const scored=[];
  for(const p of PLAYERS){
    let s=-1;
    if(p._k.startsWith(k)) s=0;
    else if(p._k.split(' ').some(w=>w.startsWith(k))) s=1;
    else if(p._k.includes(k)) s=2;
    else if(p.t===up) s=3;
    if(s>=0) scored.push([s,p]);
  }
  scored.sort((a,b)=>a[0]-b[0]||(b[1].g?1:0)-(a[1].g?1:0)||(b[1].ppr||0)-(a[1].ppr||0)||(a[1].rank||9999)-(b[1].rank||9999));
  return scored.slice(0,10).map(x=>x[1]);
}
function onSearch(n,val){
  const r=search(val); results[n-1]=r; hi[n-1]=0;
  const sd=$(`sd${n}`);
  if(!r.length){sd.style.display='none';return;}
  sd.innerHTML=r.map((p,i)=>{
    const inj=p.inj?`<span class="si-inj${OUT_STATUSES.includes(p.inj)?' out':''}">${esc(p.inj.toUpperCase())}</span>`:'';
    const bye=BYES.includes(p.t)?'<span class="si-inj out">BYE</span>':'';
    return `<div class="search-item${i===0?' sel':''}" data-i="${i}">
      <span class="ppos-badge pos-${p.p}">${p.p}</span>
      <span class="si-name">${esc(p.n)}</span>${inj}${bye}
      <span class="si-meta">${esc(p.t)}${p.g?` · ${p[scoring]} pts`:''}</span></div>`;
  }).join('');
  sd.querySelectorAll('.search-item').forEach(el=>{
    el.addEventListener('mouseenter',()=>{hi[n-1]=+el.dataset.i;highlight(n);});
    el.addEventListener('mousedown',e=>{e.preventDefault();pick(n,+el.dataset.i);});
  });
  sd.style.display='block';
}
function highlight(n){$(`sd${n}`).querySelectorAll('.search-item').forEach((el,i)=>el.classList.toggle('sel',i===hi[n-1]));}
function onKey(n,e){
  const r=results[n-1]; if(!r.length) return;
  if(e.key==='ArrowDown'){e.preventDefault();hi[n-1]=Math.min(hi[n-1]+1,r.length-1);highlight(n);}
  else if(e.key==='ArrowUp'){e.preventDefault();hi[n-1]=Math.max(hi[n-1]-1,0);highlight(n);}
  else if(e.key==='Enter'){e.preventDefault();pick(n,hi[n-1]);}
  else if(e.key==='Escape'){$(`sd${n}`).style.display='none';}
}

// ── FILL A CARD ─────────────────────────────────────────────────────────────
function setField(id,v,{force=false}={}){
  const el=$(id);
  if(el.dataset.manual&&!force) return;
  if(v==null||v===''||Number.isNaN(v)){el.value='';el.classList.remove('auto');return;}
  el.value=v; el.classList.add('auto');
}
function gameOf(p){return p&&!BYES.includes(p.t)?LINES[p.t]:null;}
function isOut(p){return !!p&&(BYES.includes(p.t)||OUT_STATUSES.includes(p.inj));}

function pick(n,i){
  const p=results[n-1][i]; if(!p) return;
  sel[n-1]=p;
  $(`n${n}`).value=p.n;
  $(`sd${n}`).style.display='none';
  ['impl','tot','spd','def','vol','snp','rz','frm'].forEach(k=>delete $(k+n).dataset.manual);
  $(`pos${n}`).textContent=p.p;
  $(`vl${n}`).textContent=(p.p==='RB'?'Carries+Tgts/G ':p.p==='QB'?'Pass att/G ':'Targets/G ')+W;

  const bye=BYES.includes(p.t);
  const L=gameOf(p);
  let tm=p.t;
  if(bye) tm+=' · BYE';
  else if(L){
    tm+=` ${L.home===false?'@':'vs'} ${L.opp}`;
    if(L.state==='post') tm+=' · FINAL';
    else if(L.state==='in') tm+=' · LIVE';
  }
  $(`tm${n}`).textContent=tm;

  const st=$(`st${n}`);
  st.style.display='';
  if(bye){st.textContent='BYE';st.className='player-status status-out';}
  else if(p.inj){st.textContent=p.inj.toUpperCase();st.className='player-status '+(OUT_STATUSES.includes(p.inj)||p.inj==='Doubtful'?'status-out':'status-q');}
  else{st.textContent='ACTIVE';st.className='player-status status-active';}

  setField(`impl${n}`,L?.impl,{force:true});
  setField(`tot${n}`,L?.total,{force:true});
  setField(`spd${n}`,L?.spread,{force:true});
  setField(`vol${n}`,p.vol,{force:true});
  setField(`snp${n}`,p.snp,{force:true});
  setField(`rz${n}`,p.rz,{force:true});
  fillScoring(n,true);

  const info=[];
  if(bye) info.push(`<span class="bad">${esc(p.t)} is on bye this week.</span>`);
  else if(OUT_STATUSES.includes(p.inj)) info.push(`<span class="bad">Listed ${esc(p.inj)}.</span>`);
  else if(p.inj) info.push(`<span class="meh">Listed ${esc(p.inj)}, check before kickoff.</span>`);
  if(L&&L.state==='post') info.push('<span class="meh">This game is already final.</span>');
  if(!bye&&!L) info.push('<span class="meh">No game found for this team. Fill lines manually.</span>');
  if(!bye&&L&&L.impl==null) info.push('<span class="meh">No Vegas line posted yet.</span>');
  info.push(p.g?`${esc(META.statsNote||'')}${p.g<3&&W.startsWith('L')?` · only ${p.g} game${p.g>1?'s':''}`:''}`:'No games played yet this season. Stats boxes are blank, fill manually if you want.');
  $(`info${n}`).innerHTML=info.join(' ');
  $(`c${n}`).className='pcard '+(isOut(p)?'warn':'ready');
  $('hint').textContent='';
}
function fillScoring(n,force){
  const p=sel[n-1]; if(!p) return;
  setField(`frm${n}`,p[scoring],{force});
  const L=gameOf(p);
  setField(`def${n}`,L?DEF?.[scoring]?.[p.p]?.[L.opp]:null,{force});
}

// ── SCORING TOGGLE ──────────────────────────────────────────────────────────
document.querySelectorAll('.sc-pill').forEach(b=>b.addEventListener('click',()=>{
  scoring=b.dataset.sc;
  document.querySelectorAll('.sc-pill').forEach(x=>x.classList.toggle('on',x===b));
  $('sc-badge').textContent=scoring==='ppr'?'PPR':scoring==='half'?'HALF PPR':'STD';
  [1,2].forEach(n=>fillScoring(n,false));
  if($('results').classList.contains('show')) analyze();
}));

// ── PROJECTION ──────────────────────────────────────────────────────────────
const gn=id=>{const v=parseFloat($(id).value);return Number.isFinite(v)?v:null;};

function project(x){
  const {impl,total,spread,vol,snap,defrank,rz,form,pos}=x;
  const implS=Math.min(100,Math.max(0,(impl-16)/(32-16)*100));
  const defS=defrank>0?Math.min(100,Math.max(0,(33-defrank)/32*100)):50;
  const paceS=Math.min(100,Math.max(0,(total-36)/(58-36)*100));
  const spdS=spread<0?Math.min(90,50+Math.abs(spread)*2.5):Math.max(10,50-spread*2.5);
  const volB={QB:35,RB:18,WR:8,TE:6}[pos]||8;
  const volS=vol>0?Math.min(100,vol/volB*100):50;
  const snapS=snap>0?Math.min(100,snap):60;
  const rzB={QB:4,RB:3,WR:2,TE:2}[pos]||2;
  const rzS=rz>0?Math.min(100,rz/rzB*100):(rz===0?0:50);
  const frmB={QB:24,RB:16,WR:16,TE:12}[pos]||16;
  const frmS=form>0?Math.min(100,form/frmB*100):(form===0?0:50);
  const comp=implS*.28+defS*.22+paceS*.12+spdS*.10+volS*.12+snapS*.06+rzS*.06+frmS*.04;
  const ranges={ppr:{QB:[12,38],RB:[4,28],WR:[3,28],TE:[2,22]},half:{QB:[11,34],RB:[3.5,25],WR:[2.5,25],TE:[1.5,19]},std:{QB:[10,30],RB:[3,22],WR:[2,22],TE:[1,17]}};
  const [lo,hi2]=ranges[scoring][pos]||[4,26];
  return {pts:Math.round((lo+comp/100*(hi2-lo))*10)/10,comp:Math.round(comp),s:{implS,defS,paceS,spdS,volS,snapS,rzS,frmS}};
}

function readCard(n){
  const p=sel[n-1];
  const L=gameOf(p);
  let pos=p?.p||$(`pos${n}`).textContent;
  if(!POS.includes(pos)) pos=null;
  return {
    n, ref:p, name:$(`n${n}`).value.trim()||`Player ${n}`, pos,
    team:p?.t||'', opp:L?.opp||'', inj:p?.inj||'',
    out:isOut(p), bye:p?BYES.includes(p.t):false,
    impl:gn(`impl${n}`)??23, total:gn(`tot${n}`)??45, spread:gn(`spd${n}`)??0,
    defrank:gn(`def${n}`)??16, vol:gn(`vol${n}`), snap:gn(`snp${n}`)??75,
    rz:gn(`rz${n}`), form:gn(`frm${n}`),
  };
}

// ── ANALYZE ─────────────────────────────────────────────────────────────────
$('go').addEventListener('click',analyze);

function analyze(){
  const a=readCard(1), b=readCard(2);
  if(!$('n1').value.trim()||!$('n2').value.trim()){$('hint').textContent='Pick two players first.';return;}
  if(!a.pos&&!b.pos){$('hint').textContent='Pick players from the dropdown so position fills in.';return;}
  a.pos=a.pos||b.pos; b.pos=b.pos||a.pos;
  $('hint').textContent='';

  const sa=project(a), sb=project(b);
  if(a.out){sa.pts=0;} if(b.out){sb.pts=0;}

  const aWins=sa.pts>=sb.pts;
  const w=aWins?a:b, l=aWins?b:a, ws=aWins?sa:sb, ls=aWins?sb:sa;
  const diff=Math.abs(sa.pts-sb.pts);
  const forced=a.out!==b.out;
  const noData=[a,b].filter(x=>!x.out&&x.vol==null&&x.form==null);
  let conf=forced?99:Math.min(95,50+(diff/Math.max(ws.pts,.1))*120);
  if(!forced&&noData.length) conf=Math.min(conf,55);

  $('vname').textContent=w.name;
  $('vpts').textContent=ws.pts;
  $('vpts2').textContent=`vs ${ls.pts} for ${l.name}`;
  const vtag=$('vtag');
  if(!forced&&diff<2){vtag.textContent='TOSS-UP';vtag.className='vtag vtag-toss';}
  else{vtag.textContent='START';vtag.className='vtag vtag-start';}
  $('vsub').textContent=forced?(l.bye?`${l.name} is on bye`:`${l.name} is ${l.inj||'out'}`)
    :noData.length?`Low confidence: no stats for ${noData.map(x=>x.name).join(' & ')}`
    :diff<2?'Coin flip range':diff<4?'Slight edge':diff<8?'Moderate edge':'Clear start';
  $('efill').style.width=conf+'%';
  $('elbl').textContent=`${Math.round(conf)}% confidence`;

  const sgn=v=>v>0?`+${v}`:`${v}`;
  const show=v=>v==null?'—':v;
  const fs=[
    {lbl:'Vegas environment',k:'vegas',a:sa.s.implS+sa.s.paceS*.5,b:sb.s.implS+sb.s.paceS*.5,
      da:`${a.impl} implied · ${a.total} O/U`,db:`${b.impl} implied · ${b.total} O/U`},
    {lbl:'Matchup quality',k:'def',a:sa.s.defS,b:sb.s.defS,
      da:`Def rank ${a.defrank}/32 vs ${a.pos}`,db:`Def rank ${b.defrank}/32 vs ${b.pos}`},
    {lbl:'Game script',k:'script',a:sa.s.spdS,b:sb.s.spdS,
      da:`${sgn(a.spread)} (${a.spread<0?'fav':a.spread>0?'dog':'pick'})`,db:`${sgn(b.spread)} (${b.spread<0?'fav':b.spread>0?'dog':'pick'})`},
    {lbl:'Usage & role',k:'usage',a:sa.s.volS*.7+sa.s.snapS*.3,b:sb.s.volS*.7+sb.s.snapS*.3,
      da:`${show(a.vol)} vol/G · ${a.snap}% snap`,db:`${show(b.vol)} vol/G · ${b.snap}% snap`},
    {lbl:'Red zone opp',k:'rz',a:sa.s.rzS,b:sb.s.rzS,da:`${show(a.rz)} opps/G`,db:`${show(b.rz)} opps/G`},
    {lbl:'Recent form',k:'form',a:sa.s.frmS,b:sb.s.frmS,da:`${show(a.form)} pts/G ${W}`,db:`${show(b.form)} pts/G ${W}`},
  ];
  $('factors').innerHTML=fs.map(f=>{
    const d=Math.abs(f.a-f.b), aw=f.a>f.b+5, bw=f.b>f.a+5;
    const cls=d>20?'fe-big':d>8?'fe-sm':'fe-eq', txt=d>20?'Clear edge':d>8?'Slight edge':'Toss-up';
    return `<div class="fcard"><div class="flbl">${f.lbl}</div><div class="fwinner">${esc(aw?a.name:bw?b.name:'Even')}</div><div class="fdetail">${esc(aw?f.da:bw?f.db:`${f.da} / ${f.db}`)}</div><span class="fedge ${cls}">${txt}</span></div>`;
  }).join('');

  $('atext').innerHTML=writeUp(a,b,sa,sb,w,l,ws,ls,diff,forced,fs);

  const rows=[
    ['Team implied pts',a.impl,b.impl,true],['Game O/U',a.total,b.total,true],['Spread',a.spread,b.spread,false],
    ['Def rank vs pos',a.defrank,b.defrank,false],['Volume/G',show(a.vol),show(b.vol),true],['Snap %',a.snap,b.snap,true],
    ['RZ opps/G',show(a.rz),show(b.rz),true],[`Pts/G ${W}`,show(a.form),show(b.form),true],
    ['Composite',sa.comp,sb.comp,true],['Projected pts',sa.pts,sb.pts,true],
  ];
  $('ctable').innerHTML=`<div class="crow chdr"><div class="cc cp1 chdr-name">${esc(a.name)}</div><div class="cc clbl">—</div><div class="cc cp2 chdr-name">${esc(b.name)}</div></div>`+
    rows.map(([lbl,v1,v2,hb])=>{
      const x=parseFloat(v1),y=parseFloat(v2),ok=!isNaN(x)&&!isNaN(y);
      const aw=ok&&(hb?x>y:x<y), bw=ok&&(hb?y>x:y<x);
      return `<div class="crow"><div class="cc cp1 ${aw?'cwin':''}">${esc(v1)}</div><div class="cc clbl">${lbl}</div><div class="cc cp2 ${bw?'cwin':''}">${esc(v2)}</div></div>`;
    }).join('');

  $('results').classList.add('show');
}

// Plain-English summary built from the same numbers (no API needed)
function writeUp(a,b,sa,sb,w,l,ws,ls,diff,forced,fs){
  const B=s=>`<strong>${esc(s)}</strong>`;
  const lc=s=>s.replace(/^(?!Vegas)\w/,c=>c.toLowerCase());
  const out=[];
  if(a.out&&b.out){
    return `Neither player is expected to play (${esc(a.name)}: ${a.bye?'bye':a.inj}, ${esc(b.name)}: ${b.bye?'bye':b.inj}). Find a third option.`;
  }
  if(forced){
    out.push(`Start ${B(w.name)}. ${esc(l.name)} ${l.bye?'is on bye':`is listed ${esc(l.inj)}`}, so this one makes itself.`);
  } else if(diff<2){
    out.push(`Toss-up. ${B(w.name)} projects ${ws.pts} to ${esc(l.name)}'s ${ls.pts}, which is inside the noise. Go with the one you trust more or the higher-upside game.`);
  } else {
    out.push(`Start ${B(w.name)}, projected ${ws.pts} vs ${ls.pts} for ${esc(l.name)} (${diff.toFixed(1)} pt edge).`);
  }
  if(!forced){
    const wKey=w===a?'a':'b', lKey=w===a?'b':'a';
    const forW=fs.map(f=>({...f,edge:f[wKey]-f[lKey]})).sort((x,y)=>y.edge-x.edge);
    const best=forW[0], worst=forW[forW.length-1];
    if(best&&best.edge>5) out.push(`Biggest factor is ${lc(best.lbl)}: ${esc(best['d'+wKey])} vs ${esc(best['d'+lKey])}.`);
    if(worst&&worst.edge<-5) out.push(`The case for ${esc(l.name)} is ${lc(worst.lbl)}: ${esc(worst['d'+lKey])}.`);
  }
  if(w.inj&&!w.out) out.push(`Heads up: ${esc(w.name)} is listed ${esc(w.inj)}. If he's ruled out, flip to ${esc(l.name)}.`);
  const gw=gameOf(w.ref);
  if(gw&&gw.state==='post') out.push(`Note: ${esc(w.name)}'s game is already final.`);
  [w,l].forEach(x=>{if(!x.out&&x.vol==null&&x.form==null) out.push(`${esc(x.name)} has no stats logged here, so his side leans on Vegas and matchup only. Treat this one as a gut call.`);});
  return out.join(' ');
}

renderHeader();
</script>
