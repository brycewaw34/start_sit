<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Scout — Start/Sit</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@300;400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080d;--s1:#0b0f17;--s2:#111722;--s3:#181f2e;
  --b1:#1c2535;--b2:#27364f;
  --gold:#f0b429;--gdim:rgba(240,180,41,.1);
  --green:#3dd68c;--red:#f16b6b;--blue:#58a6e8;--purple:#b48eff;--teal:#2dd4bf;--orange:#fb923c;
  --text:#d4dce8;--t2:#8494ae;--t3:#5a6a82;
  --pos-qb:#f43f5e;--pos-rb:#3dd68c;--pos-wr:#58a6e8;--pos-te:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;min-height:100vh}
a{color:var(--gold);text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}
.hdr{height:52px;display:flex;align-items:stretch;border-bottom:1px solid var(--b1);background:rgba(5,8,13,.97);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
.hbrand{display:flex;align-items:center;gap:11px;padding:0 20px;border-right:1px solid var(--b1)}
.logo{width:30px;height:30px;border-radius:50%;background:conic-gradient(#f43f5e 0deg 72deg,#3dd68c 72deg 144deg,#58a6e8 144deg 216deg,#fb923c 216deg 288deg,#b48eff 288deg);box-shadow:0 0 14px rgba(240,180,41,.25)}
.btext .t1{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;line-height:1}
.btext .t2s{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--t3);letter-spacing:2.5px}
.hright{padding:0 20px;display:flex;align-items:center;gap:8px;margin-left:auto}
.badge{font-family:'IBM Plex Mono',monospace;font-size:.55rem;padding:3px 8px;border-radius:2px;letter-spacing:1.5px;color:var(--gold);background:var(--gdim);border:1px solid rgba(240,180,41,.22)}
.app{max-width:1080px;margin:0 auto;padding:28px 20px}

.top-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sc-lbl{font-family:'IBM Plex Mono',monospace;font-size:.56rem;color:var(--t3);letter-spacing:2px;text-transform:uppercase}
.sc-pill{font-family:'IBM Plex Mono',monospace;font-size:.58rem;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--b2);background:transparent;color:var(--t3);transition:all .15s}
.sc-pill.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.wk-info{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--t3)}
.wk-info strong{color:var(--gold)}
.stale{color:var(--red)}
.model-note{font-family:'IBM Plex Mono',monospace;font-size:.56rem;color:var(--t3);margin-bottom:22px;line-height:1.6}

.compare{display:grid;grid-template-columns:1fr 52px 1fr;gap:14px;align-items:start;margin-bottom:24px}
.pcard{background:var(--s1);border:1px solid var(--b1);border-radius:4px}
.pcard.ready{border-color:rgba(61,214,140,.3)}
.pcard.warn{border-color:rgba(241,107,107,.4)}
.name-row{display:flex;align-items:center;border-bottom:1px solid var(--b1);position:relative}
.name-inp{flex:1;min-width:0;background:transparent;border:none;padding:13px 14px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.5px;outline:none}
.name-inp::placeholder{color:var(--t3);font-weight:400}
.player-status{font-family:'IBM Plex Mono',monospace;font-size:.52rem;padding:2px 7px;border-radius:2px;margin-right:10px;flex-shrink:0}
.status-active{background:rgba(61,214,140,.1);color:var(--green);border:1px solid rgba(61,214,140,.2)}
.status-q{background:rgba(240,180,41,.1);color:var(--gold);border:1px solid rgba(240,180,41,.2)}
.status-out{background:rgba(241,107,107,.1);color:var(--red);border:1px solid rgba(241,107,107,.2)}
.search-drop{position:absolute;top:100%;left:0;right:0;background:var(--s2);border:1px solid var(--b2);border-top:none;border-radius:0 0 3px 3px;z-index:50;max-height:280px;overflow-y:auto}
.search-item{padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(28,37,53,.5)}
.search-item:hover,.search-item.sel{background:rgba(27,38,60,.9)}
.si-name{font-size:.78rem;font-weight:600;color:var(--text);flex:1}
.si-meta{font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:var(--t3)}
.si-inj{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--gold)}
.si-inj.out{color:var(--red)}
.ppos-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.54rem;font-weight:600;padding:2px 7px;border-radius:3px}
.pos-QB{background:rgba(244,63,94,.12);color:var(--pos-qb);border:1px solid rgba(244,63,94,.25)}
.pos-RB{background:rgba(61,214,140,.1);color:var(--pos-rb);border:1px solid rgba(61,214,140,.2)}
.pos-WR{background:rgba(88,166,232,.1);color:var(--pos-wr);border:1px solid rgba(88,166,232,.2)}
.pos-TE{background:rgba(251,146,60,.12);color:var(--pos-te);border:1px solid rgba(251,146,60,.25)}

.projbox{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--b1);background:linear-gradient(180deg,rgba(240,180,41,.05),transparent)}
.pj-lbl{font-family:'IBM Plex Mono',monospace;font-size:.49rem;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase}
.pj-val{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;font-weight:900;color:var(--gold);line-height:1}
.pj-sub{font-family:'IBM Plex Mono',monospace;font-size:.56rem;color:var(--t2);text-align:right;line-height:1.7}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.5rem;padding:2px 6px;border-radius:2px;letter-spacing:1px;margin-left:6px;vertical-align:middle}
.tag-due{background:rgba(61,214,140,.12);color:var(--green);border:1px solid rgba(61,214,140,.25)}
.tag-hot{background:rgba(241,107,107,.1);color:var(--red);border:1px solid rgba(241,107,107,.25)}

.sgrid{display:grid;grid-template-columns:1fr 1fr}
.sc{padding:9px 13px;border-bottom:1px solid var(--b1);border-right:1px solid var(--b1);display:flex;flex-direction:column;gap:2px;min-width:0}
.sc:nth-child(even){border-right:none}
.sc.full{grid-column:1/-1;border-right:none}
.slbl{font-family:'IBM Plex Mono',monospace;font-size:.49rem;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase}
.sval{font-family:'IBM Plex Mono',monospace;font-size:.76rem;font-weight:500;color:var(--text)}
.sval .dim{color:var(--t3)}
.up{color:var(--green)}.down{color:var(--red)}
.info-row{padding:8px 13px;background:var(--s3);font-family:'IBM Plex Mono',monospace;font-size:.53rem;color:var(--t3);min-height:30px;line-height:1.6}
.info-row .bad{color:var(--red)}.info-row .meh{color:var(--gold)}.info-row .good{color:var(--teal)}

.vs-dot{display:flex;align-items:center;justify-content:center;width:52px;height:52px;background:var(--s2);border:1px solid var(--b1);border-radius:50%;font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:800;letter-spacing:2px;color:var(--t3);align-self:center}

.analyze-row{text-align:center;margin-bottom:28px}
.abtn{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;background:var(--gold);color:#06090f;border:none;border-radius:3px;padding:12px 44px;cursor:pointer;transition:all .2s}
.abtn:hover{background:#fdc138;box-shadow:0 4px 20px rgba(240,180,41,.3)}
.hint{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--t3);margin-top:8px;min-height:1em}

.results{display:none}.results.show{display:block}
.lineup{background:var(--s1);border:1px solid var(--b1);border-radius:4px;margin-bottom:22px}
.lu-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--b1);flex-wrap:wrap}
.lu-title{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.lu-head select{background:var(--s2);border:1px solid var(--b2);color:var(--text);padding:5px 8px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;max-width:100%}
.lu-toggle{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.56rem;color:var(--t3);cursor:pointer;background:none;border:none}
.lu-body{padding:6px 0}
.lu-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 14px;border-bottom:1px solid rgba(28,37,53,.5);cursor:pointer}
.lu-row:hover{background:rgba(27,38,60,.5)}
.lu-row:last-child{border-bottom:none}
.lu-slot{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--t3);letter-spacing:1px}
.lu-name{font-size:.8rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu-name .lu-sub{font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:var(--t3);font-weight:400;margin-left:6px}
.lu-rng{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--t3)}
.lu-pj{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--gold);font-weight:500;min-width:36px;text-align:right}
.lu-swaps{padding:9px 14px;border-top:1px solid var(--b1);background:var(--s3);font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--t2);line-height:1.7}
.lu-swaps .good{color:var(--teal)}.lu-swaps .dim{color:var(--t3)}
.lu-sec{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--t3);letter-spacing:1.5px;padding:8px 14px 2px;text-transform:uppercase}
.own{font-family:'IBM Plex Mono',monospace;font-size:.48rem;padding:1px 5px;border-radius:2px;border:1px solid var(--b2);color:var(--t3);white-space:nowrap}
.own.me{color:var(--gold);border-color:rgba(240,180,41,.35)}
.own.fa{color:var(--teal);border-color:rgba(45,212,191,.35)}
.rng{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--t3)}
@media (max-width:720px){.lu-rng{display:none}.lu-name .lu-sub{display:block;margin-left:0}}
.verdict{background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:20px 24px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.vname{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900;line-height:1}
.vtag{font-family:'IBM Plex Mono',monospace;font-size:.56rem;padding:2px 9px;border-radius:2px;letter-spacing:2px;display:inline-block;margin-top:5px}
.vtag-start{background:rgba(61,214,140,.12);color:var(--green);border:1px solid rgba(61,214,140,.25)}
.vtag-toss{background:rgba(88,166,232,.1);color:var(--blue);border:1px solid rgba(88,166,232,.2)}
.edge-bar{height:4px;background:var(--b2);border-radius:2px;overflow:hidden;margin:10px 0 4px;width:240px;max-width:100%}
.edge-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .6s cubic-bezier(.4,0,.2,1)}
.edge-lbl{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--t2)}
.vpts{font-family:'Barlow Condensed',sans-serif;font-size:2.6rem;font-weight:900;color:var(--gold);line-height:1;text-align:right}
.vpts-lbl{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--t3);text-align:right;letter-spacing:1.5px}
.vpts2{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--t3);text-align:right;margin-top:2px}
.factors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.fcard{background:var(--s2);border:1px solid var(--b1);border-radius:3px;padding:11px 13px}
.flbl{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.fwinner{font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:1px}
.fdetail{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--t2);line-height:1.5}
.fedge{font-family:'IBM Plex Mono',monospace;font-size:.52rem;padding:2px 6px;border-radius:2px;display:inline-block;margin-top:5px}
.fe-big{background:rgba(61,214,140,.1);color:var(--green);border:1px solid rgba(61,214,140,.2)}
.fe-sm{background:rgba(88,166,232,.1);color:var(--blue);border:1px solid rgba(88,166,232,.2)}
.fe-eq{background:rgba(100,116,139,.1);color:var(--t2);border:1px solid rgba(100,116,139,.2)}
.abox{background:var(--s1);border:1px solid var(--b1);border-radius:4px;padding:18px 20px;margin-bottom:16px}
.ahdr{font-family:'IBM Plex Mono',monospace;font-size:.52rem;letter-spacing:2.5px;color:var(--t3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ahdr::after{content:'';flex:1;height:1px;background:var(--b1)}
.atext{font-size:.88rem;line-height:1.8;color:var(--t2)}
.atext strong{color:var(--text)}
.ctable{background:var(--s1);border:1px solid var(--b1);border-radius:4px;overflow:hidden}
.crow{display:grid;grid-template-columns:1fr 150px 1fr;border-bottom:1px solid rgba(28,37,53,.5)}
.crow:last-child{border-bottom:none}
.crow.chdr{background:var(--s2)}
.cc{padding:8px 13px;font-family:'IBM Plex Mono',monospace;font-size:.64rem;color:var(--t2)}
.cc.cp1{text-align:right}.cc.cp2{text-align:left}
.cc.clbl{text-align:center;color:var(--t3);font-size:.52rem;letter-spacing:.5px;display:flex;align-items:center;justify-content:center}
.cc.cwin{color:var(--green);font-weight:600}
.cc.chdr-name{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:700;color:var(--text)}

@media (max-width:720px){
  .hbrand{padding:0 12px}.hright{padding:0 12px}
  .app{padding:18px 12px}
  .compare{grid-template-columns:1fr}
  .vs-dot{justify-self:center;width:40px;height:40px;font-size:.75rem}
  .wk-info{margin-left:0;width:100%}
  .factors{grid-template-columns:1fr 1fr}
  .verdict{grid-template-columns:1fr}
  .vpts,.vpts-lbl,.vpts2{text-align:left}
  .crow{grid-template-columns:1fr 104px 1fr}
}
</style>
</head>
<body>
<div class="hdr">
  <div class="hbrand">
    <div class="logo"></div>
    <div class="btext"><div class="t1">Diamond Scout</div><div class="t2s" id="season-lbl">Start / Sit</div></div>
  </div>
  <div class="hright">
    <span class="badge" id="wk-badge">WEEK —</span>
    <span class="badge" id="sc-badge" style="color:var(--blue);background:rgba(88,166,232,.08);border-color:rgba(88,166,232,.2)">PPR</span>
  </div>
</div>

<div class="app">
  <div class="top-row">
    <span class="sc-lbl">Scoring</span>
    <button class="sc-pill" data-sc="lg" id="lg-pill" style="display:none">My League</button>
    <button class="sc-pill on" data-sc="ppr">PPR</button>
    <button class="sc-pill" data-sc="half">Half PPR</button>
    <button class="sc-pill" data-sc="std">Standard</button>
    <span class="wk-info" id="wk-info"></span>
  </div>
  <div class="model-note" id="model-note"></div>

  <div class="lineup" id="lineup" style="display:none">
    <div class="lu-head">
      <span class="lu-title">Best lineup</span>
      <select id="team-sel"></select>
      <button class="lu-toggle" id="lu-toggle">hide</button>
    </div>
    <div id="lu-content"><div class="lu-body" id="lu-body"></div><div class="lu-swaps" id="lu-swaps"></div></div>
  </div>

  <div class="compare" id="compare"></div>

  <div class="analyze-row">
    <button class="abtn" id="go">Analyze Matchup</button>
    <div class="hint" id="hint"></div>
  </div>

  <div class="results" id="results">
    <div class="verdict">
      <div>
        <div class="vname" id="vname">—</div>
        <div><span class="vtag" id="vtag">START</span><span class="mono" style="font-size:.56rem;color:var(--t3);margin-left:8px" id="vsub"></span></div>
        <div class="edge-bar"><div class="edge-fill" id="efill" style="width:50%"></div></div>
        <div class="edge-lbl" id="elbl"></div>
      </div>
      <div>
        <div class="vpts" id="vpts">—</div>
        <div class="vpts-lbl">projected pts</div>
        <div class="vpts2" id="vpts2"></div>
      </div>
    </div>
    <div class="factors" id="factors"></div>
    <div class="abox"><div class="ahdr">Analysis</div><div class="atext" id="atext"></div></div>
    <div class="ctable" id="ctable"></div>
  </div>
</div>

const OUT_STATUSES=['Out','IR','PUP','Sus','NA','DNR','COV','Doubtful'];
const SIGMA=9.75;   // spread of start/sit outcomes, calibrated in the backtest
// 20th/80th percentile outcome vs projection, fit on 2025 results (about 60% of games land in between)
const RANGE={QB:{f:[0.772,-4.26],c:[0.744,9.36]},RB:{f:[0.616,-1.53],c:[1.356,1.73]},WR:{f:[0.671,-2.94],c:[1.355,1.3]},TE:{f:[0.687,-2.3],c:[1.446,1.36]}};
const L_=typeof LEAGUE!=='undefined'&&LEAGUE?LEAGUE:null;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let scoring=L_?'lg':'ppr';
const OWNER={};  // player id -> league team index
if(L_) L_.teams.forEach((t,i)=>t.players.forEach(pid=>OWNER[pid]=i));
let myTeam=L_?(()=>{const s=store.get('ds-team');const i=L_.teams.findIndex(t=>String(t.rid)===s);return i>=0?i:Math.max(0,L_.teams.findIndex(t=>t.owner===L_.me));})():-1;
const sel=[null,null], results=[[],[]], hi=[0,0];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[.'’`-]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
const f1=v=>v==null||Number.isNaN(v)?'—':(Math.round(v*10)/10).toFixed(1);
const pctS=v=>v==null?'—':Math.round(v*100)+'%';
const sgn=v=>v>0?`+${v}`:`${v}`;
const erf=x=>{const t=1/(1+.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y;};
const winProb=d=>.5*(1+erf(d/(SIGMA*Math.SQRT2)));
PLAYERS.forEach(p=>{p._k=norm(p.n);});

// ── per-player derived values ───────────────────────────────────────────────
const proj=p=>p?.pj?.[scoring]??null;
const range=p=>{const v=proj(p);const r=RANGE[p?.p];if(v==null||!r||v<=0)return null;return{lo:Math.max(0,r.f[0]*v+r.f[1]),hi:r.c[0]*v+r.c[1]};};
function ownTag(p){
  if(!L_) return '';
  const i=OWNER[p.id];
  if(i===undefined) return '<span class="own fa">FA</span>';
  if(i===myTeam) return '<span class="own me">MINE</span>';
  return `<span class="own">${esc(L_.teams[i].name.slice(0,14))}</span>`;
}
function weatherNote(L){
  if(!L) return '';
  if(L.dome) return 'dome';
  const bits=[];
  if(L.wind!=null) bits.push(`${Math.round(L.wind)} mph wind`);
  if(L.rain>=1) bits.push('rain');
  if(L.temp!=null&&L.temp<=32) bits.push(`${L.temp}°F`);
  return bits.join(', ');
}
const isBye=p=>!!p&&BYES.includes(p.t);
const isOut=p=>!!p&&(isBye(p)||OUT_STATUSES.includes(p.inj));
const gameOf=p=>p&&!isBye(p)?LINES[p.t]:null;
const luckGap=p=>p?.xp&&p.g?Math.round((p.xp[scoring]-p[scoring])*10)/10:null;   // + means due for more
function oppsText(p){
  if(!p?.op) return '—';
  const o=p.op;
  if(p.p==='QB') return `${f1(o.patt)} att · ${f1(o.car)} rush`;
  if(p.p==='RB') return `${f1(o.car)} car · ${f1(o.tgt)} tgt`;
  return `${f1(o.tgt)} tgt${o.car>=1?` · ${f1(o.car)} car`:''}`;
}
function mainShare(p){
  if(!p?.sh) return null;
  return p.p==='QB'?{k:'patt',lbl:'of pass att'}:p.p==='RB'?{k:'car',lbl:'of carries'}:{k:'tgt',lbl:'of targets'};
}

// ── header ──────────────────────────────────────────────────────────────────
function renderHeader(){
  $('wk-badge').textContent=META.week?`WEEK ${META.week}`:'WEEK —';
  $('season-lbl').textContent=`Start / Sit · ${META.season||''}`;
  let txt=`Week <strong>${META.week||'—'}</strong>`;
  if(META.updated){
    const d=new Date(META.updated), hrs=(Date.now()-d)/36e5;
    txt+=` · updated ${d.toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`;
    if(hrs>48) txt+=` · <span class="stale">data is ${Math.floor(hrs/24)} days old</span>`;
  }
  if(BYES.length) txt+=` · BYE: ${BYES.join(', ')}`;
  $('wk-info').innerHTML=txt;
  const w=META.modelWeight??0.25, acc=META.accuracy;
  const we=META.espnWeight||0;
  $('model-note').innerHTML=(we?`Projection = ${Math.round((1-w)*(1-we)*100)}% Sleeper + ${Math.round(w*(1-we)*100)}% Diamond Scout model + ${Math.round(we*100)}% ESPN`:`Projection = ${Math.round((1-w)*100)}% Sleeper + ${Math.round(w*100)}% Diamond Scout model`)+
    (L_?` · My League = ${esc(L_.name)} scoring`:'')+
    (acc?` · called ${pctS(acc.final)} of start/sit pairs right in testing (Sleeper alone ${pctS(acc.sleeper)})`:'')+
    ` · <a href="backtest.html">model report ↗</a>`;
}

// ── search ──────────────────────────────────────────────────────────────────
function search(q){
  const k=norm(q); if(k.length<2) return [];
  const up=q.trim().toUpperCase(), out=[];
  for(const p of PLAYERS){
    let s=-1;
    if(p._k.startsWith(k)) s=0; else if(p._k.split(' ').some(w=>w.startsWith(k))) s=1;
    else if(p._k.includes(k)) s=2; else if(p.t===up) s=3;
    if(s>=0) out.push([s,p]);
  }
  out.sort((a,b)=>a[0]-b[0]||((proj(b[1])??-1)-(proj(a[1])??-1))||(a[1].rank||9999)-(b[1].rank||9999));
  return out.slice(0,10).map(x=>x[1]);
}
function onSearch(n,val){
  const r=search(val); results[n-1]=r; hi[n-1]=0;
  const sd=$(`sd${n}`);
  if(!r.length){sd.style.display='none';return;}
  sd.innerHTML=r.map((p,i)=>{
    const tags=(p.inj?`<span class="si-inj${OUT_STATUSES.includes(p.inj)?' out':''}">${esc(p.inj.toUpperCase())}</span>`:'')+(isBye(p)?'<span class="si-inj out">BYE</span>':'');
    const pj=proj(p);
    return `<div class="search-item${i===0?' sel':''}" data-i="${i}"><span class="ppos-badge pos-${p.p}">${p.p}</span><span class="si-name">${esc(p.n)}</span>${tags}${ownTag(p)}<span class="si-meta">${esc(p.t)}${pj?` · proj ${f1(pj)}`:''}</span></div>`;
  }).join('');
  sd.querySelectorAll('.search-item').forEach(el=>{
    el.addEventListener('mouseenter',()=>{hi[n-1]=+el.dataset.i;highlight(n);});
    el.addEventListener('mousedown',e=>{e.preventDefault();pick(n,+el.dataset.i);});
  });
  sd.style.display='block';
}
function highlight(n){$(`sd${n}`).querySelectorAll('.search-item').forEach((el,i)=>el.classList.toggle('sel',i===hi[n-1]));}
function onKey(n,e){
  const r=results[n-1]; if(!r.length) return;
  if(e.key==='ArrowDown'){e.preventDefault();hi[n-1]=Math.min(hi[n-1]+1,r.length-1);highlight(n);}
  else if(e.key==='ArrowUp'){e.preventDefault();hi[n-1]=Math.max(hi[n-1]-1,0);highlight(n);}
  else if(e.key==='Enter'){e.preventDefault();pick(n,hi[n-1]);}
  else if(e.key==='Escape'){$(`sd${n}`).style.display='none';}
}
function pick(n,i){
  const p=results[n-1][i]; if(!p) return;
  sel[n-1]=p; $(`n${n}`).value=p.n; $(`sd${n}`).style.display='none'; $('hint').textContent='';
  fillCard(n);
}

function set(id,html){$(id).innerHTML=html;}
function fillCard(n){
  const p=sel[n-1]; if(!p) return;
  const L=gameOf(p), bye=isBye(p);
  set(`pos${n}`,p.p);
  let tm=esc(p.t);
  if(bye) tm+=' · BYE';
  else if(L){tm+=` ${L.home===false?'@':'vs'} ${esc(L.opp)}`; if(L.state==='post') tm+=' · FINAL'; else if(L.state==='in') tm+=' · LIVE';
    const wn=weatherNote(L); if(wn) tm+=` <span class="dim">· ${esc(wn)}</span>`;}
  set(`tm${n}`,tm);

  const st=$(`st${n}`); st.style.display='';
  if(bye){st.textContent='BYE';st.className='player-status status-out';}
  else if(p.inj){st.textContent=p.inj.toUpperCase();st.className='player-status '+(OUT_STATUSES.includes(p.inj)?'status-out':'status-q');}
  else{st.textContent='ACTIVE';st.className='player-status status-active';}

  const pj=proj(p);
  set(`pj${n}`,pj==null?'—':f1(pj));
  const subs=[];
  if(p.ps) subs.push(`Sleeper ${f1(p.ps[scoring])}`);
  if(p.pm) subs.push(`Our model ${f1(p.pm[scoring])}`);
  const rg=range(p);
  if(rg) subs.push(`<span class="rng">Range ${f1(rg.lo)} to ${f1(rg.hi)}</span>`);
  if(L_) subs.push(ownTag(p));
  set(`pjs${n}`,subs.join('<br>'));

  set(`vg${n}`,L&&L.impl!=null?`${f1(L.impl)} <span class="dim">·</span> ${f1(L.total)}`:'—');
  const dr=L?DEF?.[scoring]?.[p.p]?.[L.opp]:null;
  set(`sp${n}`,`${L&&L.spread!=null?sgn(L.spread):'—'} <span class="dim">·</span> ${dr?`${dr}/32`:'—'}`);
  set(`op${n}`,oppsText(p));
  const ms=mainShare(p);
  if(ms){
    const now=p.sh[ms.k], base=p.bs?.[ms.k];
    let arrow='';
    if(p.tr!=null&&Math.abs(p.tr)>=0.04) arrow=` <span class="${p.tr>0?'up':'down'}">${p.tr>0?'▲':'▼'}</span>`;
    const bump=base!=null&&now-base>=0.02?` <span class="up">(+${Math.round((now-base)*100)})</span>`:'';
    set(`sh${n}`,`${pctS(now)} <span class="dim">${ms.lbl}</span>${bump}${arrow}`);
  } else set(`sh${n}`,'—');
  const gap=luckGap(p);
  set(`fm${n}`,p.g?f1(p[scoring]):'—');
  let xtag='';
  if(gap!=null&&gap>=3) xtag='<span class="tag tag-due">DUE</span>';
  else if(gap!=null&&gap<=-3) xtag='<span class="tag tag-hot">HOT</span>';
  set(`xp${n}`,p.xp?`${f1(p.xp[scoring])}${xtag}`:'—');
  set(`snp${n}`,p.snp!=null?`${p.snp}%`:'—');
  set(`rz${n}`,p.g?f1(p.rz):'—');
  set(`adv${n}`,advText(p));

  const info=[];
  if(bye) info.push(`<span class="bad">${esc(p.t)} is on bye.</span>`);
  else if(OUT_STATUSES.includes(p.inj)) info.push(`<span class="bad">Listed ${esc(p.inj)}.</span>`);
  else if(p.inj) info.push(`<span class="meh">Listed ${esc(p.inj)}, check before kickoff.</span>`);
  if(p.bo?.length) info.push(`<span class="good">More work with ${p.bo.map(([nm,v])=>`${esc(nm)} out (+${Math.round(v*100)}% share)`).join(', ')}.</span>`);
  if(gap!=null&&gap>=3) info.push(`<span class="good">Usage says ${f1(gap)} more pts/G than he's scored. Due for more.</span>`);
  if(gap!=null&&gap<=-3) info.push(`<span class="meh">Scoring ${f1(-gap)} pts/G above what his usage supports. Expect a dip.</span>`);
  if(L&&L.state==='post') info.push('<span class="meh">Game already final.</span>');
  if(L&&!L.dome&&(L.wind||0)>=15) info.push(`<span class="meh">Windy: ${Math.round(L.wind)} mph forecast${L.gust?` (gusts ${Math.round(L.gust)})`:''}, passing game trimmed.</span>`);
  else if(L&&(L.rain||0)>=2) info.push('<span class="meh">Heavy rain in the forecast.</span>');
  if(!bye&&!L) info.push('<span class="meh">No game found for this team.</span>');
  info.push(p.g?esc(META.statsNote||''):'No games yet this season.');
  $(`info${n}`).innerHTML=info.join(' ');
  $(`c${n}`).className='pcard '+(isOut(p)?'warn':'ready');
}
function advText(p){
  const a=p.ngs; if(!a) return '<span class="dim">No Next Gen Stats yet (needs a minimum number of targets/carries)</span>';
  const parts=[];
  if(a.sep!=null) parts.push(`Separation ${a.sep} yds`);
  if(a.yacoe!=null) parts.push(`YAC vs exp ${sgn(a.yacoe)}`);
  if(a.ays!=null) parts.push(`${a.ays}% of team air yds`);
  if(a.ryoe!=null) parts.push(`RYOE ${sgn(a.ryoe)}/carry`, `${a.rpoe}% of runs beat expected`);
  return parts.length?parts.join(' <span class="dim">·</span> '):'<span class="dim">—</span>';
}

// ── scoring toggle ──────────────────────────────────────────────────────────
document.querySelectorAll('.sc-pill').forEach(b=>b.addEventListener('click',()=>{
  scoring=b.dataset.sc;
  document.querySelectorAll('.sc-pill').forEach(x=>x.classList.toggle('on',x===b));
  $('sc-badge').textContent=scoringLabel();
  [1,2].forEach(fillCard);
  renderLineup();
  if($('results').classList.contains('show')) analyze();
}));

// ── analyze ─────────────────────────────────────────────────────────────────
$('go').addEventListener('click',analyze);
function analyze(){
  const [a,b]=sel;
  if(!a||!b){$('hint').textContent='Pick two players from the dropdowns first.';return;}
  $('hint').textContent='';
  const pa=proj(a)??0, pb=proj(b)??0;
  const aWins=pa>=pb, w=aWins?a:b, l=aWins?b:a, pw=Math.max(pa,pb), pl=Math.min(pa,pb);
  const forced=isOut(a)!==isOut(b);
  const prob=forced?0.99:winProb(pw-pl);
  $('vname').textContent=w.n;
  $('vpts').textContent=f1(pw);
  $('vpts2').textContent=`vs ${f1(pl)} for ${l.n}`;
  const vt=$('vtag');
  if(!forced&&prob<0.56){vt.textContent='TOSS-UP';vt.className='vtag vtag-toss';}
  else{vt.textContent='START';vt.className='vtag vtag-start';}
  $('vsub').textContent=forced?`${l.n} ${isBye(l)?'is on bye':`is ${l.inj}`}`:prob<0.56?'Coin flip range':prob<0.62?'Slight edge':prob<0.72?'Solid edge':'Clear start';
  $('efill').style.width=Math.round(prob*100)+'%';
  $('elbl').textContent=forced?'Only one of them is playing':`${Math.round(prob*100)}% chance ${w.n} outscores ${l.n}`;

  const opp=p=>p.op?(p.op.tgt+p.op.car):null;
  const vg=p=>{const L=gameOf(p);return L&&L.impl!=null?L.impl:null;};
  const dr=p=>{const L=gameOf(p);return L?DEF?.[scoring]?.[p.p]?.[L.opp]??null:null;};
  const role=p=>{if(!p.op) return null; let s=p.tr||0; (p.bo||[]).forEach(([,v])=>s+=v); return s;};
  const F=[
    {lbl:'Projection',av:proj(a),bv:proj(b),hi:true,fmt:v=>`${f1(v)} pts`,th:1.5},
    {lbl:'Projected usage',av:a.p!=='QB'&&b.p!=='QB'?opp(a):null,bv:a.p!=='QB'&&b.p!=='QB'?opp(b):null,hi:true,txt:p=>oppsText(p),th:1.5},
    {lbl:'Due for more?',av:luckGap(a),bv:luckGap(b),hi:true,fmt:v=>v>=0?`usage says +${f1(v)} pts/G owed`:`scoring ${f1(-v)} pts/G above usage`,th:2},
    {lbl:'Vegas environment',av:vg(a),bv:vg(b),hi:true,fmt:v=>`${f1(v)} implied team pts`,th:1.5},
    {lbl:'Matchup',av:dr(a),bv:dr(b),hi:false,fmt:v=>`Def rank ${v}/32 vs position`,th:5},
    {lbl:'Role trend',av:role(a),bv:role(b),hi:true,fmt:v=>`${v>=0?'+':''}${Math.round(v*100)}% share`,th:.04},
  ];
  $('factors').innerHTML=F.map(f=>{
    let winner='Even', det='—', cls='fe-eq', txt='Toss-up';
    const show=(p,v)=>f.txt?f.txt(p):f.fmt(v);
    if(f.av!=null&&f.bv!=null){
      const d=f.av-f.bv, aw=f.hi?d>f.th:d<-f.th, bw=f.hi?d<-f.th:d>f.th;
      if(aw||bw){winner=(aw?a:b).n; det=aw?show(a,f.av):show(b,f.bv); const big=Math.abs(d)>f.th*3; cls=big?'fe-big':'fe-sm'; txt=big?'Clear edge':'Slight edge';}
      else det=`${show(a,f.av)} / ${show(b,f.bv)}`;
    }
    return `<div class="fcard"><div class="flbl">${f.lbl}</div><div class="fwinner">${esc(winner)}</div><div class="fdetail">${esc(det)}</div><span class="fedge ${cls}">${txt}</span></div>`;
  }).join('');

  $('atext').innerHTML=writeUp(a,b,w,l,pw,pl,prob,forced);

  const r=(lbl,va,vb,hb,fmt=f1)=>[lbl,va,vb,hb,fmt];
  const rows=[
    r('Projected pts',proj(a),proj(b),true),
    r('Floor (bad week)',range(a)?.lo,range(b)?.lo,true),
    r('Ceiling (good week)',range(a)?.hi,range(b)?.hi,true),
    r('Sleeper proj',a.ps?.[scoring],b.ps?.[scoring],true),
    r('ESPN proj',a.pe?.[scoring],b.pe?.[scoring],true),
    r('Our model proj',a.pm?.[scoring],b.pm?.[scoring],true),
    r('Pts/G L3',a.g?a[scoring]:null,b.g?b[scoring]:null,true),
    r('Expected pts/G L3',a.xp?.[scoring],b.xp?.[scoring],true),
    a.p==='QB'&&b.p==='QB'?r('Proj pass att',a.op?.patt,b.op?.patt,true):r('Proj targets',a.op?.tgt,b.op?.tgt,true),
    r('Proj carries',a.op?.car,b.op?.car,true),
    r('Snap % L3',a.snp,b.snp,true,v=>v+'%'),
    r('RZ opps/G L3',a.g?a.rz:null,b.g?b.rz:null,true),
    r('Implied team pts',vg(a),vg(b),true),
    r('Def rank vs pos',dr(a),dr(b),false,v=>v),
  ];
  $('ctable').innerHTML=`<div class="crow chdr"><div class="cc cp1 chdr-name">${esc(a.n)}</div><div class="cc clbl">—</div><div class="cc cp2 chdr-name">${esc(b.n)}</div></div>`+
    rows.map(([lbl,x,y,hb,fmt])=>{
      const ok=x!=null&&y!=null;
      const aw=ok&&(hb?x>y:x<y), bw=ok&&(hb?y>x:y<x);
      return `<div class="crow"><div class="cc cp1 ${aw?'cwin':''}">${x==null?'—':fmt(x)}</div><div class="cc clbl">${lbl}</div><div class="cc cp2 ${bw?'cwin':''}">${y==null?'—':fmt(y)}</div></div>`;
    }).join('');
  $('results').classList.add('show');
}

function writeUp(a,b,w,l,pw,pl,prob,forced){
  const B=s=>`<strong>${esc(s)}</strong>`, out=[];
  if(isOut(a)&&isOut(b)) return `Neither is expected to play (${esc(a.n)}: ${isBye(a)?'bye':esc(a.inj)}, ${esc(b.n)}: ${isBye(b)?'bye':esc(b.inj)}). Find a third option.`;
  if(forced){
    out.push(`Start ${B(w.n)}. ${esc(l.n)} ${isBye(l)?'is on bye':`is listed ${esc(l.inj)}`}, so this one makes itself.`);
  } else if(prob<0.56){
    out.push(`Toss-up. ${B(w.n)} projects ${f1(pw)} to ${esc(l.n)}'s ${f1(pl)}, roughly a ${Math.round(prob*100)}/${100-Math.round(prob*100)} call. Go with the one whose ceiling you need.`);
  } else {
    out.push(`Start ${B(w.n)}: ${f1(pw)} projected vs ${f1(pl)}. A gap that size goes his way about ${Math.round(prob*100)}% of the time.`);
  }
  if(!forced){
    const why=[];
    if(w.op&&l.op&&w.p===l.p&&w.p!=='QB'){
      const wu=w.op.tgt+w.op.car, lu=l.op.tgt+l.op.car;
      if(wu-lu>=2) why.push(`more projected work (${oppsText(w)} vs ${oppsText(l)})`);
    }
    const gw=luckGap(w), gl=luckGap(l);
    if(gw!=null&&gw>=3) why.push(`his usage says he's been unlucky (${f1(gw)} pts/G short of expected)`);
    if(gl!=null&&gl<=-3) why.push(`${esc(l.n)} has been outscoring his usage by ${f1(-gl)} pts/G, which rarely lasts`);
    const Lw=gameOf(w), Ll=gameOf(l);
    if(Lw?.impl!=null&&Ll?.impl!=null&&Lw.impl-Ll.impl>=3) why.push(`a better scoring environment (${f1(Lw.impl)} vs ${f1(Ll.impl)} implied team pts)`);
    if(w.bo?.length) why.push(`extra work with ${w.bo.map(x=>esc(x[0])).join(' and ')} out`);
    if(why.length) out.push(`Main reasons: ${why.slice(0,3).join('; ')}.`);
    const cl=[];
    if(gl!=null&&gl>=3) cl.push(`he's due for more based on usage`);
    if(l.bo?.length) cl.push(`he picks up work with ${l.bo.map(x=>esc(x[0])).join(' and ')} out`);
    if(l.tr!=null&&l.tr>=0.05) cl.push(`his role has been growing`);
    if(cl.length) out.push(`The case for ${esc(l.n)}: ${cl.join('; ')}.`);
  }
  const rw=range(w), rl=range(l);
  if(!forced&&rw&&rl){
    const safer=rw.lo>=rl.lo?w:l, upside=rw.hi>=rl.hi?w:l;
    if(safer!==upside) out.push(`Need a safe floor? ${esc(safer.n)} (bad week ~${f1(range(safer).lo)}). Need a big game? ${esc(upside.n)} (good week ~${f1(range(upside).hi)}).`);
    else out.push(`${esc(w.n)} has both the higher floor (~${f1(rw.lo)}) and the higher ceiling (~${f1(rw.hi)}).`);
  }
  const ww=gameOf(w);
  if(ww&&!ww.dome&&(ww.wind||0)>=15) out.push(`Wind watch: ${Math.round(ww.wind)} mph forecast for ${esc(w.n)}'s game.`);
  if(w.inj&&!isOut(w)) out.push(`Heads up: ${esc(w.n)} is listed ${esc(w.inj)}. If he's ruled out, flip to ${esc(l.n)}.`);
  if(gameOf(w)?.state==='post') out.push(`Note: ${esc(w.n)}'s game is already final.`);
  if(!w.pj) out.push(`${esc(w.n)} has no projection yet, so treat this as a gut call.`);
  return out.join(' ');
}

// ── my team: best lineup ───────────────────────────────────────────────────
function scoringLabel(){return scoring==='lg'?'MY LEAGUE':scoring==='ppr'?'PPR':scoring==='half'?'HALF PPR':'STD';}
const SLOT_ELIG={QB:['QB'],RB:['RB'],WR:['WR'],TE:['TE'],FLEX:['RB','WR','TE'],REC_FLEX:['WR','TE'],WRRB_FLEX:['RB','WR'],SUPER_FLEX:['QB','RB','WR','TE']};
const SLOT_LBL={FLEX:'FLEX',REC_FLEX:'W/T',WRRB_FLEX:'W/R',SUPER_FLEX:'SF'};
const BYID={}; PLAYERS.forEach(p=>BYID[p.id]=p);
function bestLineup(ids){
  const pool=ids.map(id=>BYID[id]).filter(Boolean);
  const slots=(L_.positions||[]).filter(s=>SLOT_ELIG[s]);
  // fill the most restrictive slots first; with nested flex slots this greedy fill is optimal
  const order=[...slots.keys()].sort((a,b)=>SLOT_ELIG[slots[a]].length-SLOT_ELIG[slots[b]].length);
  const used=new Set(), filled=new Array(slots.length).fill(null);
  for(const i of order){
    const c=pool.filter(p=>!used.has(p.id)&&SLOT_ELIG[slots[i]].includes(p.p)).sort((a,b)=>(proj(b)??-1)-(proj(a)??-1))[0];
    if(c){filled[i]=c;used.add(c.id);}
  }
  return {slots,filled,bench:pool.filter(p=>!used.has(p.id)).sort((a,b)=>(proj(b)??-1)-(proj(a)??-1))};
}
function luRow(slot,p){
  if(!p) return `<div class="lu-row"><span class="lu-slot">${slot}</span><span class="lu-name" style="color:var(--t3)">empty</span><span></span><span></span></div>`;
  const L=gameOf(p), rg=range(p), st=isBye(p)?'BYE':p.inj?p.inj.toUpperCase():'';
  const sub=`${esc(p.t)}${L?` ${L.home===false?'@':'vs'} ${esc(L.opp)}`:''}${st?` · <span style="color:var(--${isOut(p)?'red':'gold'})">${esc(st)}</span>`:''}`;
  return `<div class="lu-row" data-id="${p.id}"><span class="lu-slot">${slot}</span><span class="lu-name"><span class="ppos-badge pos-${p.p}">${p.p}</span> ${esc(p.n)}<span class="lu-sub">${sub}</span></span><span class="lu-rng">${rg?`${f1(rg.lo)}–${f1(rg.hi)}`:''}</span><span class="lu-pj">${f1(proj(p))}</span></div>`;
}
let nextCard=1;
function renderLineup(){
  if(!L_||myTeam<0) return;
  const team=L_.teams[myTeam];
  const {slots,filled,bench}=bestLineup(team.players);
  const total=filled.reduce((s,p)=>s+(proj(p)||0),0);
  $('lu-body').innerHTML=slots.map((s,i)=>luRow(SLOT_LBL[s]||s,filled[i])).join('')+
    `<div class="lu-sec">Bench</div>`+bench.map(p=>luRow('BN',p)).join('');
  // compare with the lineup currently set in Sleeper
  const best=new Set(filled.filter(Boolean).map(p=>p.id));
  const cur=new Set(team.starters.filter(id=>BYID[id]));
  const ins=[...best].filter(id=>!cur.has(id)).map(id=>BYID[id]).sort((a,b)=>proj(b)-proj(a));
  const outs=[...cur].filter(id=>!best.has(id)).map(id=>BYID[id]).sort((a,b)=>proj(a)-proj(b));
  let sw=`Projected starters: <strong style="color:var(--gold)">${f1(total)}</strong> pts · K and DEF not projected.`;
  if(!team.starters.length) sw+=' No lineup set in Sleeper yet.';
  else if(!ins.length) sw+=' <span class="good">Your Sleeper lineup already matches the best lineup.</span>';
  else{
    const curTotal=[...cur].reduce((s,id)=>s+(proj(BYID[id])||0),0);
    sw+=`<br>Vs your current Sleeper lineup (<span class="good">+${f1(total-curTotal)} pts</span>): start ${ins.map(p=>`<strong>${esc(p.n)}</strong> (${f1(proj(p))})`).join(', ')}`+
      (outs.length?`; bench ${outs.map(p=>`${esc(p.n)} (${f1(proj(p))}${isOut(p)?`, ${isBye(p)?'bye':esc(p.inj)}`:''})`).join(', ')}`:'')+'.';
  }
  sw+='<br><span class="dim">Tap a player to load him into the comparison below. Sleeper lineup as of the last update.</span>';
  $('lu-swaps').innerHTML=sw;
  $('lu-body').querySelectorAll('.lu-row[data-id]').forEach(el=>el.addEventListener('click',()=>{
    const p=BYID[el.dataset.id]; if(!p) return;
    results[nextCard-1]=[p]; pick(nextCard,0); nextCard=nextCard===1?2:1;
    $('compare').scrollIntoView({behavior:'smooth',block:'start'});
  }));
}
function initLeague(){
  if(!L_) return;
  $('lg-pill').style.display='';
  document.querySelectorAll('.sc-pill').forEach(x=>x.classList.toggle('on',x.dataset.sc===scoring));
  $('sc-badge').textContent=scoringLabel();
  $('lineup').style.display='';
  $('team-sel').innerHTML=L_.teams.map((t,i)=>`<option value="${i}"${i===myTeam?' selected':''}>${esc(t.name)}${t.owner&&t.owner!==t.name?` (${esc(t.owner)})`:''}</option>`).join('');
  $('team-sel').addEventListener('change',e=>{myTeam=+e.target.value;store.set('ds-team',String(L_.teams[myTeam].rid));renderLineup();[1,2].forEach(fillCard);});
  const setHidden=hd=>{$('lu-content').style.display=hd?'none':'';$('lu-toggle').textContent=hd?'show':'hide';store.set('ds-lu-hidden',hd?'1':'0');};
  setHidden(store.get('ds-lu-hidden')==='1');
  $('lu-toggle').addEventListener('click',()=>setHidden($('lu-content').style.display!=='none'));
  renderLineup();
}

renderHeader();
initLeague();
</script>
